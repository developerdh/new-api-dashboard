name: Release audit-proxy

# 独立于看板的发布流水线：tag 前缀区分，产物是非容器的静态二进制包。
# 触发：git tag audit-proxy-v0.1.0 && git push origin audit-proxy-v0.1.0

on:
  push:
    tags:
      - "audit-proxy-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 audit-proxy- 前缀，如 v0.1.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: audit-proxy/go.mod
          cache-dependency-path: audit-proxy/go.mod

      - name: 解析版本
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#audit-proxy-}" >> "$GITHUB_OUTPUT"
          fi

      - name: 静态检查
        working-directory: audit-proxy
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "::error::存在未格式化文件"; gofmt -l .; exit 1; }

      - name: 交叉编译并打包
        working-directory: audit-proxy
        env:
          VERSION: ${{ steps.v.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            pkg="audit-proxy_${VERSION}_linux_${arch}"
            mkdir -p "dist/${pkg}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/${pkg}/audit-proxy" .
            cp audit-proxy.service audit-proxy.env.example README.md "dist/${pkg}/"
            chmod 0755 "dist/${pkg}/audit-proxy"
            tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
            rm -rf "dist/${pkg}"
          done
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
          cat dist/SHA256SUMS

      # 产物必须能在干净 Linux 上直接执行（静态链接、无 glibc 依赖）
      - name: 冒烟验证
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && tar -xzf audit-proxy/dist/*_linux_amd64.tar.gz -C /tmp/smoke
          BIN="$(find /tmp/smoke -name audit-proxy -type f)"
          "$BIN" -version
          file "$BIN" | tee /dev/stderr | grep -q "statically linked"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: audit-proxy ${{ steps.v.outputs.value }}
          files: |
            audit-proxy/dist/*.tar.gz
            audit-proxy/dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
