name: Release dashcam

# 独立于看板的发布流水线：tag 前缀区分，产物是非容器的静态二进制包。
# 触发：git tag dashcam-v0.1.0 && git push origin dashcam-v0.1.0

on:
  push:
    tags:
      - "dashcam-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 dashcam- 前缀，如 v0.1.0）"
        required: true

permissions:
  contents: write

concurrency:
  # 同一 tag 的重跑串行执行（发布动作不 cancel，避免中断半完成的发布）
  group: release-dashcam-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 不能开 fetch-tags：tag push 事件 + 浅克隆下，actions/checkout 会把
      # 「事件 commit SHA」与「tag ref」双源写入同一 refs/tags/*，附注标签的
      # tag object ≠ commit，实测 v0.1.1 tag push 触发即挂（Cannot fetch both ...）。
      # tag 附注改由下方发布说明步骤按需补取（单 refspec，不与 commit 写入冲突）。
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: dashcam/go.mod
          cache-dependency-path: dashcam/go.mod

      - name: 解析版本
        id: v
        # workflow_dispatch 输入经 env 中转再进脚本：直接内插 ${{ }} 会在解析前逃逸引号，
        # 构成 run: 命令注入面（inputs 由有写权限的成员填写，仍按规范防御）
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            VALUE="$VERSION_INPUT"
          else
            VALUE="${GITHUB_REF_NAME#dashcam-}"
          fi
          # 版本须为 v+数字/点形态（如 v0.1.0、v0.1.0-beta.1），保证产物命名与
          # tag（dashcam-v*）口径一致，同时防止畸形输入经 GITHUB_OUTPUT 传播到后续步骤
          case "$VALUE" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::版本号须形如 v0.1.0（v + 数字/点）"; exit 1;;
          esac
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      # 发布说明取 tag 附注，而不是 GitHub 自动生成——自动生成的对比区间会在
      # 看板（v*）与 dashcam（dashcam-v*）两套 tag 命名空间之间串线（实测首发时
      # 对比到了看板 v0.1.1，并把 PR 合并记录当成了发布内容）。附注缺失时给兜底文案。
      - name: 提取 tag 附注作为发布说明
        run: |
          TAG="dashcam-${{ steps.v.outputs.value }}"
          # 按需补取附注标签对象（单 refspec 取 ref，不会与 checkout 的 commit 写入冲突）；
          # workflow_dispatch 触发时同样依赖此处拿到远端已有 tag 的附注
          if ! git cat-file -t "$TAG" >/dev/null 2>&1; then
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" || true
          fi
          NOTES=""
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          fi
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="dashcam ${{ steps.v.outputs.value }} 发布。部署与配置见仓库 docs/dashcam/03-deployment.md。"
          fi
          printf '%s\n' "$NOTES" > release-body.md

      - name: 静态检查
        working-directory: dashcam
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { echo "::error::存在未格式化文件"; gofmt -l .; exit 1; }

      - name: 交叉编译并打包
        working-directory: dashcam
        env:
          VERSION: ${{ steps.v.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            pkg="new-api-dashcam_${VERSION}_linux_${arch}"
            mkdir -p "dist/${pkg}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/${pkg}/new-api-dashcam" .
            cp new-api-dashcam.service dashcam.env.example clean-dashcam.sh README.md "dist/${pkg}/"
            chmod 0755 "dist/${pkg}/new-api-dashcam" "dist/${pkg}/clean-dashcam.sh"
            tar -C dist -czf "dist/${pkg}.tar.gz" "${pkg}"
            rm -rf "dist/${pkg}"
          done
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
          cat dist/SHA256SUMS

      # 产物必须能在干净 Linux 上直接执行（静态链接、无 glibc 依赖）
      - name: 冒烟验证
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && tar -xzf dashcam/dist/*_linux_amd64.tar.gz -C /tmp/smoke
          BIN="$(find /tmp/smoke -name new-api-dashcam -type f)"
          "$BIN" -version
          file "$BIN" | tee /dev/stderr | grep -q "statically linked"

      - name: 发布 Release
        # 第三方 action 固定到 commit SHA（v2）防 tag 可变导致的供应链篡改
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # 手动触发时 ref_name 是分支名，不能直接当 tag；tag 推送时由版本反推的结果恰等于 ref_name
          tag_name: dashcam-${{ steps.v.outputs.value }}
          name: dashcam ${{ steps.v.outputs.value }}
          files: |
            dashcam/dist/*.tar.gz
            dashcam/dist/SHA256SUMS
          body_path: release-body.md
          fail_on_unmatched_files: true
