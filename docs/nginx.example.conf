# ============================================================================
# nginx.example.conf —— 反向代理参考配置
#
# 关键约束（踩过的坑，改动前请先读）：
#   1. `Host` 必须用 `$http_host`（含端口）。`$host` 会剥掉端口，导致站点对外
#      origin 与浏览器不一致，登录接口返回 403 invalid_origin。
#   2. nginx 的 listen 端口不能与容器发布到宿主机的端口相同。Linux 下
#      0.0.0.0:N 与 127.0.0.1:N 互斥，冲突会让 reload 静默失败（只写 error.log）。
#   3. 本文件假设容器发布在 127.0.0.1:3088。若改了映射端口（如 13088:3088），
#      只改下方 upstream，不要改 listen。
#
# 放置：/etc/nginx/conf.d/new-api-dashboard.conf（或主配置 include 的目录内）
# 校验：nginx -t && nginx -s reload
# ============================================================================

upstream new_api_dashboard {
    # 容器发布到宿主机的地址；容器内端口固定 3088（healthcheck 依赖它）
    server 127.0.0.1:3088;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# 方案 A：对外提供 HTTPS（推荐）。80 仅做跳转。
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name dashboard.example.com;

    # 证书签发（如 certbot）需要放行该路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dashboard.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 对外 origin 的判定依赖这几个头，缺一不可
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://new_api_dashboard;
        proxy_read_timeout 60s;
    }

    # 快照需要服务端渲染整页，耗时明显长于普通请求
    location /api/snapshot {
        proxy_pass http://new_api_dashboard;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 静态资源文件名带内容哈希，可长缓存
    location /_next/static/ {
        proxy_pass http://new_api_dashboard;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 接口响应已带 no-store，这里显式关闭代理缓存，避免误缓存统计结果
    location /api/ {
        proxy_pass http://new_api_dashboard;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

